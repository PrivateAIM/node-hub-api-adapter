name: CI

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read # for checkout

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-and-test:
    name: "Install package and run unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install package
        run: uv sync

      - name: Run unit tests
        run: uv run pytest tests/

  preview-image:
    name: "Build preview image"
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout  # required for finding action
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Pull requests from forks get a read-only token, so they can only verify
      # that the image still compiles - they cannot publish a preview image.
      - name: Build preview image
        uses: ./.github/actions/build-docker-image
        with:
          platforms: linux/amd64
          docker_file: Dockerfile
          push: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          extra_tag: pr-${{ github.event.number }}
